<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1D3A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#142D5E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5FBA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E5FBA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A9EFF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4A9EFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#4A9EFF;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:#1E5FBA;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#1E5FBA;stop-opacity:0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4A9EFF" stroke-width="0.3" opacity="0.1"/>
    </pattern>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bgGradient)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- Glow effects -->
  <ellipse cx="256" cy="120" rx="400" ry="200" fill="url(#glow1)"/>
  <ellipse cx="1024" cy="280" rx="350" ry="180" fill="url(#glow2)"/>

  <!-- Decorative lines -->
  <g stroke="url(#accentGradient)" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1280" y2="100" stroke-dasharray="10,20"/>
    <line x1="0" y1="300" x2="1280" y2="300" stroke-dasharray="10,20"/>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="100" width="4" height="200" fill="url(#accentGradient)" rx="2"/>

  <!-- Main text content -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <!-- Name -->
    <text x="120" y="175" font-size="48" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5px">
      Oussama Zligui
    </text>

    <!-- Professional headline -->
    <text x="120" y="235" font-size="22" font-weight="400" fill="#B0C4DE" letter-spacing="0.5px">
      IT Infrastructure  •  Networking  •  Cybersecurity
    </text>

    <!-- Subtitle line -->
    <text x="120" y="285" font-size="16" font-weight="300" fill="#78909C" letter-spacing="1px">
      Ingénierie Informatique & Réseaux — Cybersécurité & Infrastructures
    </text>
  </g>

  <!-- Right side decorative elements -->
  <g transform="translate(980, 100)">
    <!-- Tech stack indicators -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#78909C">
      <text x="0" y="0" font-weight="500" fill="#4A9EFF">TECH STACK</text>
      <text x="0" y="28">pfSense • Wazuh • Suricata</text>
      <text x="0" y="52">Linux • Windows Server • AD</text>
      <text x="0" y="76">VLAN • OSPF • BGP • STP</text>
      <text x="0" y="100">Python • C++ • Bash • Docker</text>
      <text x="0" y="124">VMware • Proxmox • GNS3</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <line x1="80" y1="350" x2="1200" y2="350" stroke="url(#accentGradient)" stroke-width="2" opacity="0.5"/>

  <!-- Corner accents -->
  <g stroke="url(#accentGradient)" stroke-width="2" fill="none">
    <path d="M 80 100 L 80 140 M 80 100 L 120 100"/>
    <path d="M 80 300 L 80 260 M 80 300 L 120 300"/>
    <path d="M 1200 100 L 1200 140 M 1200 100 L 1160 100"/>
    <path d="M 1200 300 L 1200 260 M 1200 300 L 1160 300"/>
  </g>
</svg>