<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E5FBA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A9EFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5FBA;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#ringGradient)" stroke-width="4"/>

  <!-- Inner circle background -->
  <circle cx="100" cy="100" r="90" fill="url(#avatarGradient)" opacity="0.15"/>

  <!-- Placeholder icon - User silhouette -->
  <g fill="#4A9EFF" opacity="0.6">
    <!-- Head -->
    <circle cx="100" cy="75" r="28"/>
    <!-- Shoulders -->
    <path d="M 45 170 Q 45 130 70 110 L 130 110 Q 155 130 155 170 Z"/>
  </g>

  <!-- Camera/icon indicator -->
  <g transform="translate(135, 135)">
    <circle cx="0" cy="0" r="18" fill="#0B1D3A"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#4A9EFF" stroke-width="2"/>
    <path d="M -6 0 L -2 -4 L 0 0 L 2 -4 L 6 0" fill="none" stroke="#4A9EFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="4" fill="none" stroke="#4A9EFF" stroke-width="1.5"/>
  </g>

  <!-- Text label -->
  <text x="100" y="195" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#4A9EFF" opacity="0.7">
    Replace with your photo
  </text>
</svg>