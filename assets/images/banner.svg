<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1D3A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#142D5E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5FBA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E5FBA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A9EFF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="25%" r="45%">
      <stop offset="0%" style="stop-color:#4A9EFF;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#4A9EFF;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="40%">
      <stop offset="0%" style="stop-color:#1E5FBA;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#1E5FBA;stop-opacity:0" />
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#4A9EFF" stroke-width="0.25" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="url(#bgGradient)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <!-- Subtle glow effects -->
  <ellipse cx="192" cy="90" rx="450" ry="220" fill="url(#glow1)"/>
  <ellipse cx="1088" cy="270" rx="400" ry="200" fill="url(#glow2)"/>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="4" height="200" fill="url(#accentGradient)" rx="2"/>

  <!-- Main text content -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <!-- Name -->
    <text x="120" y="155" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5px">
      Oussama Zligui
    </text>

    <!-- Professional headline -->
    <text x="120" y="210" font-size="20" font-weight="400" fill="#B0C4DE" letter-spacing="0.5px">
      IT Infrastructure  •  Networking  •  Cybersecurity
    </text>

    <!-- Subtitle line -->
    <text x="120" y="255" font-size="15" font-weight="300" fill="#78909C" letter-spacing="1px">
      Ingénierie Informatique & Réseaux — Cybersécurité & Infrastructures
    </text>
  </g>

  <!-- Right side tech stack -->
  <g transform="translate(980, 80)">
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#78909C">
      <text x="0" y="0" font-weight="600" fill="#4A9EFF" letter-spacing="0.5px" text-transform="uppercase">Tech Stack</text>
      <text x="0" y="26">pfSense • Wazuh • Suricata</text>
      <text x="0" y="48">Linux • Windows Server • AD</text>
      <text x="0" y="70">VLAN • OSPF • BGP • STP</text>
      <text x="0" y="92">Python • C++ • Bash • Docker</text>
      <text x="0" y="114">VMware • Proxmox • GNS3</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <line x1="80" y1="310" x2="1200" y2="310" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>

  <!-- Corner accents -->
  <g stroke="url(#accentGradient)" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 80 80 L 80 115 M 80 80 L 115 80"/>
    <path d="M 80 280 L 80 245 M 80 280 L 115 280"/>
    <path d="M 1200 80 L 1200 115 M 1200 80 L 1165 80"/>
    <path d="M 1200 280 L 1200 245 M 1200 280 L 1165 280"/>
  </g>
</svg>